<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="1">
  <title>Схема: як знайти КаваLab</title>
  <defs>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2.2" fill="#16130f"/>
    </pattern>
  </defs>

  <!-- квартали -->
  <rect width="640" height="420" fill="#e8e3d7"/>

  <!-- парк -->
  <rect x="380" y="40" width="220" height="150" fill="url(#dots)" opacity=".28"/>
  <text x="490" y="120" text-anchor="middle" fill="#16130f">ПАРК</text>

  <!-- вулиці -->
  <g stroke="#f4f1ea" stroke-linecap="square">
    <path d="M0 230h640" stroke-width="44"/>
    <path d="M330 0v420" stroke-width="36"/>
    <path d="M0 80l200 150" stroke-width="24"/>
    <path d="M150 420V230" stroke-width="20"/>
  </g>

  <!-- трамвайна колія -->
  <path d="M0 230h640" stroke="#16130f" stroke-width="2.5" stroke-dasharray="14 9"/>
  <circle cx="500" cy="230" r="9" fill="#f4f1ea" stroke="#16130f" stroke-width="3"/>
  <text x="500" y="270" text-anchor="middle" fill="#16130f">ТРАМВАЙ 2</text>

  <text x="24" y="210" fill="#16130f">ВУЛ. КАВОВА</text>

  <!-- кав'ярня на розі -->
  <rect x="216" y="130" width="90" height="74" fill="#16130f"/>
  <path d="M261 96c-22 0-38 16-38 36 0 26 38 60 38 60s38-34 38-60c0-20-16-36-38-36z" fill="#e5432a" stroke="#16130f" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="261" cy="132" r="12" fill="#f4f1ea" stroke="#16130f" stroke-width="4"/>
  <rect x="196" y="24" width="130" height="32" fill="#16130f"/>
  <text x="261" y="45" text-anchor="middle" fill="#f4f1ea" font-weight="700">КАВАLAB</text>
  <path d="M261 56v38" stroke="#16130f" stroke-width="3"/>
</svg>
