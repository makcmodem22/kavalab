<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>Бар і кавомашина</title>
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="2.6" fill="#f4f1ea"/>
    </pattern>
  </defs>

  <!-- стіна -->
  <rect width="800" height="600" fill="#e5432a"/>

  <!-- лампи зі світловими конусами -->
  <g>
    <path d="M150 0v96M330 0v64" stroke="#16130f" stroke-width="5"/>
    <path d="M96 150h108l-22-54h-64zM282 112h96l-20-48h-56z" fill="#16130f"/>
    <path d="M96 150h108l70 280H26zM282 112h96l60 318H222z" fill="#f4f1ea" opacity=".16"/>
  </g>

  <!-- полиця з банками зерна -->
  <path d="M452 150h300" stroke="#16130f" stroke-width="10" stroke-linecap="square"/>
  <g fill="#f4f1ea" stroke="#16130f" stroke-width="6" stroke-linejoin="round">
    <rect x="478" y="84" width="46" height="61"/>
    <rect x="544" y="64" width="52" height="81"/>
    <rect x="616" y="96" width="42" height="49"/>
    <rect x="678" y="74" width="50" height="71"/>
  </g>
  <g fill="#16130f">
    <rect x="478" y="112" width="46" height="14"/>
    <rect x="544" y="98" width="52" height="16"/>
    <rect x="678" y="104" width="50" height="14"/>
  </g>

  <!-- барна стійка -->
  <rect y="430" width="800" height="170" fill="#16130f"/>
  <rect y="430" width="800" height="170" fill="url(#dots)" opacity=".14"/>
  <rect y="412" width="800" height="22" fill="#f4f1ea" stroke="#16130f" stroke-width="6"/>

  <!-- кавомашина -->
  <g stroke="#16130f" stroke-width="8" stroke-linejoin="round">
    <rect x="388" y="214" width="340" height="56" fill="#16130f"/>
    <rect x="404" y="270" width="308" height="142" fill="#f4f1ea"/>
    <rect x="404" y="270" width="308" height="44" fill="#e8e3d7"/>
  </g>
  <!-- манометр і кнопки -->
  <circle cx="450" cy="292" r="12" fill="#f4f1ea" stroke="#16130f" stroke-width="5"/>
  <path d="M450 292l6-7" stroke="#e5432a" stroke-width="4" stroke-linecap="round"/>
  <g fill="#16130f">
    <rect x="580" y="284" width="18" height="16"/>
    <rect x="610" y="284" width="18" height="16"/>
    <rect x="640" y="284" width="18" height="16"/>
    <circle cx="684" cy="292" r="9" fill="#e5432a" stroke="#16130f" stroke-width="4"/>
  </g>
  <!-- групи з холдерами -->
  <g fill="#16130f">
    <rect x="474" y="314" width="56" height="20"/>
    <rect x="586" y="314" width="56" height="20"/>
    <path d="M482 334h40l-6 16h-28zM594 334h40l-6 16h-28z"/>
    <rect x="522" y="336" width="44" height="9"/>
    <rect x="634" y="336" width="44" height="9"/>
  </g>
  <!-- чашки під групами -->
  <g fill="#f4f1ea" stroke="#16130f" stroke-width="6" stroke-linejoin="round">
    <path d="M478 372h48c0 22-8 36-24 36s-24-14-24-36zM590 372h48c0 22-8 36-24 36s-24-14-24-36z"/>
  </g>
  <path d="M502 352v16M614 352v16" stroke="#16130f" stroke-width="5" stroke-linecap="round"/>
  <!-- паровий кран -->
  <path d="M430 314v54l-14 30" fill="none" stroke="#16130f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- стос чашок і пітчер ліворуч -->
  <g fill="#f4f1ea" stroke="#16130f" stroke-width="6" stroke-linejoin="round">
    <path d="M92 380h72l-8 30h-56zM98 350h60l-6 30h-48zM104 320h48l-6 30h-36z"/>
    <path d="M232 342h64l-8 68h-48z"/>
    <path d="M296 356c26 0 26 34-6 36" fill="none"/>
  </g>
</svg>
