<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>Зал з арковими вікнами</title>
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="2.6" fill="#f4f1ea"/>
    </pattern>
  </defs>

  <!-- стіна й підлога -->
  <rect width="800" height="600" fill="#e8e3d7"/>
  <rect y="470" width="800" height="130" fill="#16130f"/>
  <rect y="470" width="800" height="130" fill="url(#dots)" opacity=".14"/>

  <!-- три аркові вікна -->
  <g fill="#e5432a" stroke="#16130f" stroke-width="8" stroke-linejoin="round">
    <path d="M70 470V200a90 90 0 0 1 180 0v270z"/>
    <path d="M310 470V200a90 90 0 0 1 180 0v270z"/>
    <path d="M550 470V200a90 90 0 0 1 180 0v270z"/>
  </g>
  <!-- сонце у середньому вікні -->
  <circle cx="400" cy="230" r="46" fill="#f4f1ea"/>
  <!-- рами -->
  <g stroke="#16130f" stroke-width="6">
    <path d="M160 112v358M70 300h180M400 112v358M310 300h180M640 112v358M550 300h180"/>
  </g>

  <!-- лампа -->
  <path d="M520 0v70" stroke="#16130f" stroke-width="5"/>
  <path d="M480 112h80l-16-42h-48z" fill="#16130f"/>

  <!-- лівий столик зі стільцями -->
  <g fill="#16130f">
    <rect x="150" y="392" width="170" height="12"/>
    <rect x="229" y="404" width="12" height="96"/>
    <rect x="196" y="496" width="78" height="10"/>
  </g>
  <g fill="none" stroke="#16130f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M96 340v168M96 432h56v76"/>
    <path d="M374 340v168M374 432h-56v76"/>
  </g>
  <!-- чашка на столику -->
  <path d="M218 364h36c0 16-6 26-18 26s-18-10-18-26z" fill="#f4f1ea" stroke="#16130f" stroke-width="6" stroke-linejoin="round"/>

  <!-- правий столик -->
  <g fill="#16130f">
    <rect x="490" y="408" width="140" height="12"/>
    <rect x="554" y="420" width="12" height="80"/>
    <rect x="524" y="496" width="72" height="10"/>
  </g>
  <path d="M446 366v142M446 446h48v62" fill="none" stroke="#16130f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- рослина -->
  <path d="M664 430h72l-10 78h-52z" fill="#f4f1ea" stroke="#16130f" stroke-width="8" stroke-linejoin="round"/>
  <g fill="#16130f">
    <path d="M700 430c-6-60-40-96-78-104 4 50 30 86 78 104z"/>
    <path d="M700 430c2-70 26-112 66-128 6 56-14 100-66 128z"/>
    <path d="M700 430c-2-50-14-84-2-128 22 36 22 84 2 128z"/>
  </g>
</svg>
