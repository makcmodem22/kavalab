<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>Обсмаження зерна</title>
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="2.6" fill="#f4f1ea"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#16130f"/>
  <rect y="500" width="800" height="100" fill="url(#dots)" opacity=".16"/>
  <path d="M0 500h800" stroke="#f4f1ea" stroke-width="6"/>

  <!-- димар -->
  <path d="M330 150V60h300V0" fill="none" stroke="#f4f1ea" stroke-width="40" stroke-linejoin="miter"/>
  <!-- дим у «растрі» -->
  <circle cx="700" cy="80" r="70" fill="url(#dots)" opacity=".5"/>

  <!-- воронка для зеленого зерна -->
  <path d="M250 96h160l-40 84h-80z" fill="#e5432a" stroke="#f4f1ea" stroke-width="8" stroke-linejoin="round"/>

  <!-- ноги й корпус ростера -->
  <path d="M250 420l-36 80M410 420l36 80" stroke="#f4f1ea" stroke-width="14" stroke-linecap="square"/>
  <rect x="196" y="176" width="268" height="260" fill="#f4f1ea"/>

  <!-- барабан з оглядовим вікном -->
  <circle cx="330" cy="306" r="104" fill="#16130f"/>
  <circle cx="330" cy="306" r="72" fill="#e5432a"/>
  <g fill="#16130f">
    <ellipse cx="306" cy="290" rx="16" ry="10" transform="rotate(-30 306 290)"/>
    <ellipse cx="352" cy="282" rx="16" ry="10" transform="rotate(24 352 282)"/>
    <ellipse cx="334" cy="328" rx="16" ry="10" transform="rotate(-12 334 328)"/>
    <ellipse cx="292" cy="334" rx="14" ry="9" transform="rotate(40 292 334)"/>
    <ellipse cx="372" cy="322" rx="14" ry="9" transform="rotate(-48 372 322)"/>
  </g>
  <!-- ручка пробовідбірника -->
  <path d="M464 250h56" stroke="#f4f1ea" stroke-width="12" stroke-linecap="round"/>
  <circle cx="530" cy="250" r="14" fill="#e5432a" stroke="#f4f1ea" stroke-width="6"/>

  <!-- жолоб і лоток охолодження -->
  <path d="M410 400l96 44" stroke="#f4f1ea" stroke-width="22" stroke-linecap="square"/>
  <ellipse cx="610" cy="452" rx="150" ry="38" fill="#f4f1ea"/>
  <ellipse cx="610" cy="446" rx="126" ry="26" fill="#16130f"/>
  <g fill="#e5432a">
    <ellipse cx="540" cy="444" rx="13" ry="7" transform="rotate(-20 540 444)"/>
    <ellipse cx="578" cy="436" rx="13" ry="7" transform="rotate(16 578 436)"/>
    <ellipse cx="612" cy="452" rx="13" ry="7" transform="rotate(-8 612 452)"/>
    <ellipse cx="648" cy="438" rx="13" ry="7" transform="rotate(30 648 438)"/>
    <ellipse cx="684" cy="450" rx="13" ry="7" transform="rotate(-26 684 450)"/>
    <ellipse cx="596" cy="462" rx="11" ry="6"/>
    <ellipse cx="642" cy="460" rx="11" ry="6" transform="rotate(14 642 460)"/>
  </g>
  <path d="M610 490v10" stroke="#f4f1ea" stroke-width="14"/>
</svg>
