<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>Літня тераса</title>
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="2.6" fill="#16130f"/>
    </pattern>
  </defs>

  <!-- небо, сонце, бруківка -->
  <rect width="800" height="600" fill="#f4f1ea"/>
  <rect y="330" width="800" height="150" fill="url(#dots)" opacity=".1"/>
  <circle cx="636" cy="150" r="92" fill="#e5432a"/>
  <rect y="480" width="800" height="120" fill="#16130f"/>

  <!-- ліва парасоля: смуги по черзі -->
  <g stroke="#16130f" stroke-width="8" stroke-linejoin="round">
    <path d="M60 250a170 170 0 0 1 340 0z" fill="#f4f1ea"/>
    <path d="M60 250a170 170 0 0 1 86-148L174 250zM230 80a170 170 0 0 1 56 9l-56 161zM343 123a170 170 0 0 1 57 127h-114z" fill="#e5432a"/>
  </g>
  <path d="M230 250v230" stroke="#16130f" stroke-width="10"/>

  <!-- права парасоля, менша -->
  <g stroke="#16130f" stroke-width="8" stroke-linejoin="round">
    <path d="M440 300a130 130 0 0 1 260 0z" fill="#16130f"/>
    <path d="M505 187a130 130 0 0 1 130 0l-65 113z" fill="#f4f1ea"/>
  </g>
  <path d="M570 300v180" stroke="#16130f" stroke-width="10"/>

  <!-- столики -->
  <g fill="#16130f">
    <rect x="150" y="390" width="160" height="12"/>
    <rect x="500" y="404" width="140" height="12"/>
  </g>
  <!-- стільці -->
  <g fill="none" stroke="#16130f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M96 344v136M96 428h52v52"/>
    <path d="M364 344v136M364 428h-52v52"/>
    <path d="M454 362v118M454 438h46v42"/>
    <path d="M686 362v118M686 438h-46v42"/>
  </g>
  <!-- склянки на столах -->
  <g fill="#e5432a" stroke="#16130f" stroke-width="6" stroke-linejoin="round">
    <path d="M196 350h28l-4 38h-20zM250 356h24l-3 32h-18z"/>
    <path d="M556 366h28l-4 36h-20z"/>
  </g>

  <!-- вазон -->
  <path d="M724 420h56l-8 60h-40z" fill="#f4f1ea" stroke="#16130f" stroke-width="8" stroke-linejoin="round"/>
  <g fill="#16130f">
    <path d="M752 420c-4-44-26-68-52-76 2 38 20 62 52 76z"/>
    <path d="M752 420c2-50 18-80 44-92 4 42-10 72-44 92z"/>
  </g>
</svg>
